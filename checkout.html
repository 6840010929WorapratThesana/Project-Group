<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ชำระเงินและที่อยู่จัดส่ง - ก๋วยเตี๋ยวซิ่ง</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html#home">
        <i class="fa-solid fa-bolt me-2"></i>ก๋วยเตี๋ยวซิ่ง
      </a>
      <a href="index.html" class="btn btn-racing-outline btn-sm">
        <i class="fa-solid fa-arrow-left me-1"></i>กลับหน้าหลัก
      </a>
    </div>
  </nav>

  <!-- Checkout Section -->
  <section class="py-5">
    <div class="container">
      <div class="text-center mb-5">
        <span class="racing-badge bg-warning text-dark">CHECKOUT & DELIVERY</span>
        <h1 class="fw-bold fs-1 mt-2">ยืนยันคำสั่งซื้อ & ที่อยู่จัดส่ง</h1>
        <p class="text-secondary">กรอกข้อมูลสำหรับให้เรือซิ่งเดลิเวอรี่จัดส่งความอร่อยถึงหน้าบ้านคุณ</p>
      </div>

      <div class="row g-5 justify-content-center">
        <!-- ฟอร์มกรอกที่อยู่และชำระเงิน -->
        <div class="col-lg-8">
          <div class="menu-card p-4 rounded-4 border-secondary">
            <h3 class="h5 fw-bold text-light mb-4"><i class="fa-solid fa-address-book text-warning me-2"></i>ข้อมูลการจัดส่ง</h3>
            
            <form onsubmit="event.preventDefault(); alert('สั่งซื้อสำเร็จ! เรือซิ่งกำลังออกเดินทาง 🛵💨'); window.location.href='index.html';">
              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label class="form-label text-secondary small">ชื่อ-นามสกุลผู้รับ</label>
                  <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="เช่น สมชาย ใจดี" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label text-secondary small">เบอร์โทรศัพท์ติดต่อ</label>
                  <input type="tel" class="form-control bg-dark text-light border-secondary" placeholder="089-123-4567" required>
                </div>
                <div class="col-12">
                  <label class="form-label text-secondary small">ที่อยู่จัดส่ง (บ้านเลขที่, ถนน, แขวง/ตำบล)</label>
                  <textarea class="form-control bg-dark text-light border-secondary" rows="3" placeholder="ระบุที่อยู่ให้ชัดเจนเพื่อให้เรือซิ่งส่งด่วนได้ทันเวลา" required></textarea>
                </div>
                <div class="col-md-6">
                  <label class="form-label text-secondary small">เขต/อำเภอ</label>
                  <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="เช่น บางใหญ่" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label text-secondary small">รหัสไปรษณีย์</label>
                  <input type="text" class="form-control bg-dark text-light border-secondary" placeholder="11140" required>
                </div>
              </div>

              <h3 class="h5 fw-bold text-light mb-3 pt-3 border-top border-secondary"><i class="fa-solid fa-wallet text-warning me-2"></i>วิธีชำระเงิน</h3>
              
              <div class="mb-4">
                <div class="form-check mb-2 p-3 bg-dark border border-secondary rounded-3">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="qrPromptPay" checked>
                  <label class="form-check-label text-light fw-bold w-100" for="qrPromptPay">
                    <i class="fa-solid fa-qrcode text-warning me-2"></i> สแกนจ่ายผ่าน QR PromptPay (สปีดโอนไว)
                  </label>
                </div>
                <div class="form-check p-3 bg-dark border border-secondary rounded-3">
                  <input class="form-check-input" type="radio" name="paymentMethod" id="cashOnDelivery">
                  <label class="form-check-label text-light fw-bold w-100" for="cashOnDelivery">
                    <i class="fa-solid fa-money-bill-wave text-success me-2"></i> เก็บเงินปลายทาง (ตอนรับชามซิ่ง)
                  </label>
                </div>
              </div>

              <button type="submit" class="btn btn-racing-primary w-100 py-3 fw-bold fs-5">
                <i class="fa-solid fa-paper-plane me-2"></i>ยืนยันการสั่งซื้อซิ่งด่วน
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="mt-5 py-4 border-top border-secondary">
    <div class="container text-center text-secondary small">
      <p class="mb-0">© 2026 ก๋วยเตี๋ยวซิ่ง (Guay Tiew Racing) Co., Ltd. PIM Project</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
